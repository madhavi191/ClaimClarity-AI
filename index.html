    <script>
      // Per system instructions: HMR is disabled in AI Studio; ignore transient WebSocket errors.
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason.message || event.reason).includes('WebSocket') ||
          String(event.reason.message || event.reason).includes('vite:ws')
        )) {
          event.preventDefault();
        }
      });
    </script>
